<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hantar Permohonan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #102c50, #1766a4);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.application-box {
    background: white;
    width: 100%;
    max-width: 440px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
    animation: fadeIn .4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.header-banner {
    background: linear-gradient(90deg, #0052cc, #0066ff);
    padding: 28px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.header-banner::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: .4;
}

.apply-badge {
    background: #ffcc00;
    color: #003380;
    font-size: 32px;
    font-weight: 800;
    padding: 8px 24px;
    border-radius: 8px;
    display: inline-block;
    position: relative;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 3px 0 #cc9900;
}

.header-banner h2 {
    color: white;
    font-size: 20px;
    margin-top: 14px;
    font-weight: 600;
}

.application-content {
    padding: 26px 22px;
}

.application-content h3 {
    font-size: 18px;
    color: #102c50;
    margin-bottom: 10px;
}

.application-description {
    font-size: 13px;
    color: #6d7787;
    line-height: 1.7;
    margin-bottom: 22px;
}

.form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #334155;
}

.phone-wrapper {
    display: flex;
    align-items: center;
    border: 1px solid #d5dce5;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    transition: .2s;
}

.phone-wrapper:focus-within {
    border-color: #1766a4;
    box-shadow: 0 0 0 3px rgba(23,102,164,.1);
}

.country-code {
    background: #f1f5f9;
    padding: 14px 12px;
    font-size: 15px;
    font-weight: 600;
    color: #334155;
    border-right: 1px solid #d5dce5;
}

.phone-input {
    flex: 1;
    padding: 14px 12px;
    border: none;
    font-size: 15px;
    outline: none;
    font-family: inherit;
}

.consent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 12px;
    color: #687386;
    line-height: 1.6;
    margin-bottom: 22px;
}

.consent input {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.submit-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    background: linear-gradient(90deg, #1766a4, #102c50);
    color: white;
    transition: transform .2s, box-shadow .2s;
}

.submit-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(16,44,80,.35);
}

.submit-button:active {
    transform: translateY(0);
}

.submit-button:disabled {
    opacity: .7;
    cursor: not-allowed;
    transform: none;
}

.application-status {
    font-size: 13px;
    margin-bottom: 14px;
    color: #c0392b;
    display: none;
    text-align: center;
    padding: 8px;
    background: #fdecea;
    border-radius: 6px;
}

.success-box {
    text-align: center;
    padding: 10px 0 20px;
    display: none;
}

.success-box.show {
    display: block;
}

.success-icon {
    width: 60px;
    height: 60px;
    background: #22c55e;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 12px;
    color: white;
    font-size: 32px;
}

.success-box h4 {
    color: #16a34a;
    font-size: 17px;
    margin-bottom: 6px;
}

.success-box p {
    font-size: 13px;
    color: #64748b;
}
</style>
</head>
<body>

<div class="application-box">
    <div class="header-banner">
        <div class="apply-badge">APPLY NOW</div>
        <h2>Hantar Permohonan Sekarang</h2>
    </div>

    <div class="application-content">
        
        <p id="jobDescription" class="application-description">Untuk mendaftar sila log masuk menggunakan akaun Telegram. Kami akan menghantar pautan untuk melengkapkan sesi permohonan anda yang telah disiapkan.</p>

        <form id="applicationForm">
            <input type="hidden" id="selectedJob" name="job">

            <label class="form-label" for="phoneNumber">Nombor Telefon Malaysia</label>
            <div class="phone-wrapper">
                <span class="country-code">+60</span>
                <input
                    type="tel"
                    id="phoneNumber"
                    name="phone"
                    class="phone-input"
                    placeholder="Contoh: 123456789"
                    inputmode="tel"
                    autocomplete="tel"
                    pattern="1[0-9]{7,9}"
                    required
                >
            </div>

            <label class="consent">
                <input type="checkbox" id="consentCheck" required>
                <span>Saya bersetuju nombor telefon saya dihantar kepada pihak pengurusan untuk tujuan permohonan pekerjaan.</span>
            </label>

            <p id="applicationStatus" class="application-status" role="status"></p>

            <button type="submit" class="submit-button">
                Hantar Permohonan
            </button>
        </form>

        <div class="success-box" id="successBox">
            <div class="success-icon">✓</div>
            <h4>Permohonan Dihantar!</h4>
            <p>Terima kasih. Kami akan menghubungi anda sebentar lagi.</p>
        </div>
    </div>
</div>

<script>
// Boleh tukar nama jawatan & keterangan di sini
const DEFAULT_JOB_TITLE = "Pembantu Tadbir Pejabat";
const DEFAULT_JOB_DESC = "Untuk mendaftar sila log masuk menggunakan akaun Telegram. Kami akan menghantar pautan untuk melengkapkan sesi permohonan anda yang telah disiapkan.";

document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("jobTitle").textContent = DEFAULT_JOB_TITLE;
    document.getElementById("jobDescription").textContent = DEFAULT_JOB_DESC;
    document.getElementById("selectedJob").value = DEFAULT_JOB_TITLE;
});

/* HANTAR PERMOHONAN */
document.getElementById("applicationForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const form = this;

        if (!form.reportValidity()) return;

        const job = document.getElementById("selectedJob").value.trim();
        const phone = document.getElementById("phoneNumber").value.trim();
        const consent = document.getElementById("consentCheck").checked;

        const submitButton = form.querySelector(".submit-button");
        const status = document.getElementById("applicationStatus");
        const successBox = document.getElementById("successBox");

        successBox.classList.remove("show");
        status.style.display = "none";

        if (!job || !phone || !consent) {
            status.textContent = "Sila lengkapkan semua maklumat.";
            status.style.display = "block";
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Sedang Menghantar...";

        try {
            // Ganti dengan URL API sebenar apabila sedia
            /*
            const response = await fetch("/api/apply", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ job, phone, consent })
            });

            const result = await response.json();
            if (!response.ok || result.success !== true) {
                throw new Error(result.message || "Permohonan gagal dihantar.");
            }
            */

            // Simulasi penghantaran
            await new Promise(resolve => setTimeout(resolve, 1200));

            // Simpan data
            sessionStorage.setItem("applicationPhone", phone);
            sessionStorage.setItem("applicationJob", job);

            // Tunjuk kejayaan
            form.style.display = "none";
            successBox.classList.add("show");

        } catch (error) {
            console.error("Error:", error);
            status.textContent = error.message || "Tidak dapat menghubungi server. Sila cuba lagi.";
            status.style.display = "block";
            submitButton.disabled = false;
            submitButton.textContent = "Hantar Permohonan";
        }
    });
</script>

</body>
</html>
