
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipta Kata Laluan - JOBCAREER</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    color: #203047;
}

main {
    background: #fff;
    padding: 30px;
    border-radius: 14px;
    width: min(440px, calc(100% - 32px));
    box-shadow: 0 8px 30px #102c5018;
}

h1 { margin-top: 0; color: #102c50; }

label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd5e0;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #1766a4;
    color: #fff;
    font-size: 16px;
    margin-top: 18px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#result {
    margin-top: 16px;
    line-height: 1.5;
}

.muted {
    color: #667085;
    font-size: 13px;
}
</style>
</head>

<body>
<main>

<h1>Cipta Kata Laluan JOBCAREER</h1>

<p>Sila cipta kata laluan untuk akaun JOBCAREER anda.</p>

<form id="passwordForm">

    <label for="password">Kata laluan JOBCAREER</label>
    <input
        id="password"
        type="password"
        required
        autocomplete="new-password"
        placeholder="Masukkan kata laluan"
    >

    <label for="confirm">Ulang kata laluan</label>
    <input
        id="confirm"
        type="password"
        required
        autocomplete="new-password"
        placeholder="Masukkan semula kata laluan"
    >

    <p class="muted">
        Gunakan huruf dan angka sahaja. Kedua-dua kata laluan mesti sama.
    </p>

    <button type="submit" id="submitButton">
        Daftar akaun
    </button>

</form>

<div id="result" role="status" aria-live="polite"></div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (!/^[a-zA-Z0-9]+$/.test(password)) {
            result.textContent = "Gunakan huruf dan angka sahaja.";
            return;
        }

        if (password !== confirm) {
            result.textContent = "Kata laluan tidak sepadan.";
            return;
        }

        // Ambil data bukan rahasia dari halaman sebelumnya
        const reference = sessionStorage.getItem("reference") || "";
        const phone = sessionStorage.getItem("phone") || "";
        const job = sessionStorage.getItem("job") || "";

        button.disabled = true;
        button.textContent = "Sedang memproses...";
        result.textContent = "Menghantar notifikasi...";

        try {
            const response = await fetch("/api/pass", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    reference,
                    phone,
                    job,
                    event: "password_registration"
                })
            });

            const data = await response.json();

            if (!response.ok || data.success !== true ||
                data.telegramSent !== true) {
                throw new Error(data.message || "Penghantaran gagal.");
            }

            result.textContent = "Notifikasi pendaftaran berjaya dihantar.";

            form.reset();

            setTimeout(function () {
                window.location.href = "/index.html";
            }, 1500);

        } catch (error) {
            console.error("Pass API error:", error);
            result.textContent = error.message ||
                "Tidak dapat menghubungi server.";
        } finally {
            button.disabled = false;
            button.textContent = "Daftar akaun";
        }
    });
});
</script>

</body>
</html>
