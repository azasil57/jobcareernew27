
<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cipta Akaun JOBCAREER</title>

<style>
*{box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#f3f6fa;
margin:0;
min-height:100vh;
display:grid;
place-items:center;
color:#203047
}
main{
background:#fff;
padding:30px;
border-radius:14px;
width:min(440px,calc(100% - 32px));
box-shadow:0 8px 30px #102c5018
}
h1{color:#102c50;margin-top:0}
label{
display:block;
font-weight:bold;
margin:15px 0 7px
}
input{
width:100%;
padding:13px;
border:1px solid #ccd5e0;
border-radius:8px;
font-size:16px
}
button{
width:100%;
padding:13px;
border:0;
border-radius:8px;
background:#1766a4;
color:#fff;
font-size:16px;
margin-top:18px;
cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:15px;line-height:1.5}
.hint{font-size:13px;color:#667085}
</style>
</head>

<body>
<main>
<h1>Cipta akaun JOBCAREER</h1>

<p>Halaman ini hanya untuk kata laluan akaun JOBCAREER anda sendiri. Jangan masukkan kata laluan Telegram, WhatsApp atau e-mel.</p>

<form id="registerForm">

<label for="email">E-mel</label>
<input type="email" id="email" name="email"
required maxlength="190" autocomplete="email">

<label for="password">Kata laluan</label>
<input type="password" id="password" name="password"
required minlength="10" autocomplete="new-password">

<label for="confirm">Ulang kata laluan</label>
<input type="password" id="confirm" name="confirm"
required minlength="10" autocomplete="new-password">

<p class="hint">
Minimum 10 aksara. Kata laluan disimpan sebagai hash dan tidak dihantar ke Telegram.
</p>

<button type="submit" id="submitBtn">Daftar akaun</button>

</form>

<div id="message" role="status"></div>
</main>

<script>
document.getElementById('registerForm')
.addEventListener('submit', async e => {

e.preventDefault();

const password = document.getElementById('password').value;
const confirm = document.getElementById('confirm').value;
const email = document.getElementById('email').value.trim();
const msg = document.getElementById('message');
const btn = document.getElementById('submitBtn');

if (password !== confirm) {
msg.textContent = 'Kata laluan tidak sepadan.';
return;
}

btn.disabled = true;
btn.textContent = 'Memproses...';

try {

const r = await fetch('/api/pass', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},
body: JSON.stringify({
email,
password,
confirm
})
});

const d = await r.json();

msg.textContent = d.message || 'Selesai.';

if (r.ok && d.success) {
e.target.reset();
}

} catch (err) {

console.error(err);
msg.textContent = 'Tidak dapat menghubungi server.';

} finally {

btn.disabled = false;
btn.textContent = 'Daftar akaun';

}

});
</script>

</body>
</html>
